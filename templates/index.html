<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Onboarding Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <nav class="side-nav" aria-label="Primary">
    <div class="nav-mark" title="Onboarding Pulse">OP</div>
    <button class="nav-item active" data-view="pulse" title="Overview" aria-label="Overview" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2-6 4 12 2-6h7"/></svg>
    </button>
  </nav>

  <header class="top-bar">
    <div class="top-left">
      <h1 class="product-name">Onboarding Pulse</h1>
      <span class="product-sep">/</span>
      <span class="view-label" id="viewLabel">Overview</span>
    </div>
    <div class="top-right">
      <span class="chip"><span class="dot"></span> Example data</span>
      <span class="chip subtle">Jev</span>
      <span class="chip" id="connChip"><span class="dot muted" id="connDot"></span> <span id="connLabel">Idle</span></span>
      <button class="btn-ghost" type="button" id="streamToggle">Pause</button>
    </div>
  </header>

  <main class="workspace">
    <section class="view active dense" data-view="pulse">
      <div class="kpis" id="kpis"></div>
      <div class="grid-main">
        <div class="panel">
          <div class="panel-head compact">
            <h2 class="panel-title">Team × issue</h2>
          </div>
          <div class="heatmap-wrap" id="heatmap"></div>
        </div>
        <div class="panel">
          <div class="panel-head compact">
            <h2 class="panel-title">Risk over tenure</h2>
          </div>
          <div class="chart-wrap"><canvas id="weekChart"></canvas></div>
        </div>
      </div>
      <div class="grid-lower">
        <div class="panel">
          <div class="panel-head compact">
            <h2 class="panel-title">At-risk hires</h2>
          </div>
          <div style="overflow:auto;max-height:100%">
            <table class="issue-table" id="riskTable">
              <thead>
                <tr>
                  <th>Hire</th>
                  <th>Team</th>
                  <th>Day</th>
                  <th>Risk</th>
                  <th>Evidence</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="panel score-panel">
          <div class="panel-head compact">
            <h2 class="panel-title">Score a signal</h2>
          </div>
          <form class="score-form" id="liveForm">
            <textarea id="liveText" placeholder="Paste a Slack message…" required></textarea>
            <div class="score-row">
              <select id="liveChannel" aria-label="Channel">
                <option value="slack">Slack</option>
                <option value="ticket">Ticket</option>
                <option value="checkin">Check-in</option>
                <option value="buddy">Buddy</option>
              </select>
              <input id="liveDay" type="number" min="1" max="90" value="21" aria-label="Day" />
            </div>
            <button class="btn-primary" type="submit" id="liveBtn">Score with Jev</button>
          </form>
          <div id="liveResult"></div>
        </div>
      </div>
    </section>

  </main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-top">
    <div>
      <h2 id="drawerTitle"></h2>
      <div class="sub" id="drawerSub"></div>
    </div>
    <button class="btn-ghost" id="drawerClose" type="button" aria-label="Close">Close</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
